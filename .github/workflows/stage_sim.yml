name: Stage simulator

on:
  pull_request:
    paths:
      - 'tools/stage_sim/**'
      - '.github/workflows/stage_sim.yml'
  push:
    branches: [main]
    paths:
      - 'tools/stage_sim/**'
      - '.github/workflows/stage_sim.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --manifest-path tools/stage_sim/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --locked --manifest-path tools/stage_sim/Cargo.toml
      - name: Run clippy
        run: cargo clippy --locked --manifest-path tools/stage_sim/Cargo.toml -- -D warnings
