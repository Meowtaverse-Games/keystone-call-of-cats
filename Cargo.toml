[package]
name = "keystone-cc"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["wav"] }
bevy_ecs = "0.19.1"
bevy_asset_loader = "0.27.0"
bevy_egui = "0.42.0"
bevy_render = "0.19.1"
bevy_camera = "0.19.1"
bevy_fluent = "0.15.0"
avian2d = "0.7.0"
rhai = { version = "1.26.0", features = ["sync"] }
rand = "0.10.2"
ron = "0.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
steamworks = { version = "0.13.1", optional = true }
thiserror = "2.0.20"
fluent_content = "0.0.5"
unic-langid = { version = "0.9.6", features = ["macros"] }
keystone-lang = { git = "https://github.com/Meowtaverse-Games/keystone-lang.git", rev = "267d9ccdf94e336ab282580763ee28a6a1139272" }
bevy_embedded_assets = "0.16.0"

[features]
default = ["experimental"]
steam = ["dep:steamworks"]
experimental = []

[build-dependencies]
winres = "0.1.12"

[package.metadata.bundle.mac]
identifier = "com.meowtaverse-games.com.keystone-cc"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# strip = false
# debug = true
