[package]
name = "keystone-cc"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_ecs = "0.18.1"
bevy_asset_loader = "0.25.0"
bevy_egui = "0.39.0"
bevy_render = "0.18.1"
bevy_camera = "0.18.1"
bevy_fluent = "0.14.0"
avian2d = "0.6.1"
rhai = { version = "1.23.6", features = ["sync"] }
rand = "0.9.2"
ron = "0.12.0"
serde = { version = "1", features = ["derive"] }
steamworks = { version = "0.12.2", optional = true }
thiserror = "2.0.17"
fluent_content = "0.0.5"
unic-langid = { version = "0.9.4", features = ["macros"] }
keystone-lang = { git="https://github.com/Meowtaverse-Games/keystone-lang.git" }
bevy_embedded_assets = "0.15.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser build is a 2D game. Avoid linking Bevy's unused 3D/PBR/GLTF
# stack, which exceeds the memory available on standard GitHub-hosted runners.
bevy = { version = "0.18.1", default-features = false, features = ["2d", "wav"] }
# Required by keystone-lang's rand 0.10 dependency on wasm32-unknown-unknown.
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.18.1", features = ["wav"]}

[features]
default = ["experimental"]
steam = ["dep:steamworks"]
experimental = []

[build-dependencies]
winres = "0.1.12"

[package.metadata.bundle.mac]
identifier = "com.meowtaverse-games.com.keystone-cc"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# strip = false
# debug = true

# WebAssembly linking is substantially more memory-intensive with the native
# release profile's whole-program LTO. Keep that profile untouched for desktop
# releases, while making the browser bundle reproducible on standard runners.
[profile.web-release]
inherits = "release"
lto = false
codegen-units = 16
